<div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ inventario.discoteca }}</h5>
      <p class="card-text">
        Entrada: {{ inventario.entrada }}<br>
        Precio: {{inventario.precio}} euros <br>
        Entradas disponibles: {{ inventario.stock}}
      </p>
      <button type="button" class="btn btn-primary ">
        <a href="{% url 'comprar_producto' inventario.id %}"class="text-white">Comprar</a>
      </button>
    </div>
</div>
